name: Static checks
on:
  push:
    branches: [main, fix/home-schedule-loading-v111]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check champions.js
          node --check sw.js
      - name: Asset and PWA checks
        run: node tests/static-checks.cjs
