name: Publish CodeXaStacio TV Guide

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codexastacio-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate application
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s manifest.json
          test -s sw.js
          node --check app.js

      - name: Publish latest main to gh-pages
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Refresh refs immediately before publishing. This avoids stale
          # gh-pages leases when another deployment updated the branch.
          git fetch origin main gh-pages --prune

          # Publish the latest main commit. Retry once if gh-pages moved
          # between fetch and push.
          if ! git push origin origin/main:refs/heads/gh-pages --force; then
            echo "gh-pages changed during publish; refreshing and retrying..."
            git fetch origin main gh-pages --prune
            git push origin origin/main:refs/heads/gh-pages --force
          fi
